name: live-servers

# Eight demo servers behind one nginx gateway on host port 443.
# Each service publishes ONLY on 127.0.0.1; the gateway (host networking)
# is the only public entry point, routing by path prefix with the prefix
# forwarded intact. The audited production stack in /opt/audited-stack is
# a separate project and is not touched by this file.

services:
  maclan:
    build:
      context: ./services/maclan
    container_name: live-maclan
    restart: unless-stopped
    mem_limit: 192m
    environment:
      BASE_PATH: /maclan
      MACLAN_DB_PATH: /data/maclan.db
    volumes:
      - maclan-data:/data
    ports:
      - "127.0.0.1:18101:8000"

  xbox:
    build:
      context: ./services/xbox-cloud-saves
    container_name: live-xbox
    restart: unless-stopped
    mem_limit: 192m
    environment:
      BASE_PATH: /xbox
      XSAVE_AUTH: xsts
      XSAVE_STORAGE: local
      XSAVE_PRESIGN: local
      XSAVE_XSTS_SIGNING_KEY: ${XSAVE_XSTS_SIGNING_KEY}
      XSAVE_DEV_SECRET: ${XSAVE_DEV_SECRET}
      # Public base for minted transfer URLs (the gateway strips the
      # port from Host; see backend/app.py). install.sh maintains this
      # in .env; empty = request.base_url fallback (local/tests).
      XSAVE_PUBLIC_BASE_URL: ${XSAVE_PUBLIC_BASE_URL:-}
    volumes:
      - xsave-data:/data/xsave
    ports:
      - "127.0.0.1:18102:8000"

  wyze:
    build:
      context: ./services/wyze-bridge
      dockerfile: Dockerfile.demo
    container_name: live-wyze
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:18103:8000"

  usb:
    build:
      context: ./services/usb-sovereign
    container_name: live-usb
    restart: unless-stopped
    mem_limit: 128m
    environment:
      # AWS sink activation (Stage 3 — runbook:
      # services/usb-sovereign/aws-activation/README.md). The master
      # gate and per-sink flags default OFF here and in the app; the
      # host .env flips them at activation time. Cert paths point into
      # the read-only secrets mount below (populated on the host by
      # bootstrap-certs.sh; the private key never leaves the host).
      USB_SOV_AWS_ENABLED: ${USB_SOV_AWS_ENABLED:-0}
      USB_SOV_AWS_IOT: ${USB_SOV_AWS_IOT:-0}
      USB_SOV_AWS_S3: ${USB_SOV_AWS_S3:-0}
      USB_SOV_IOT_ENDPOINT: ${USB_SOV_IOT_ENDPOINT:-}
      USB_SOV_IOT_CERT: /secrets/usb-sovereign/cert.pem
      USB_SOV_IOT_KEY: /secrets/usb-sovereign/private.key
      USB_SOV_IOT_CA: /secrets/usb-sovereign/AmazonRootCA1.pem
      USB_SOV_S3_BUCKET: ${USB_SOV_S3_BUCKET:-911transedu-serial-batches}
      USB_SOV_AWS_REGION: ${USB_SOV_AWS_REGION:-us-west-2}
    volumes:
      - /home/deploy/live-servers/secrets/usb-sovereign:/secrets/usb-sovereign:ro
    ports:
      - "127.0.0.1:18104:8765"

  aircore:
    build:
      context: ./services/aircore
    container_name: live-aircore
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:18105:8765"

  fmp:
    build:
      context: ./services/fmp
    container_name: live-fmp
    restart: unless-stopped
    mem_limit: 192m
    environment:
      BASE_PATH: /fmp
    ports:
      - "127.0.0.1:18106:8787"

  celltower:
    build:
      context: ./services/cell-tower-lan
    container_name: live-celltower
    restart: unless-stopped
    mem_limit: 256m
    environment:
      BASE_PATH: /celltower
      CELL_LAN_MASTER_KEY: ${CELL_LAN_MASTER_KEY}
    volumes:
      - celltower-data:/data
    ports:
      - "127.0.0.1:18107:4173"

  cport:
    build:
      context: ./services/cport-pipeline
    container_name: live-cport
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:18108:8000"

  members:
    build:
      context: ./services/member-site
    container_name: live-members
    restart: unless-stopped
    mem_limit: 128m
    environment:
      BASE_PATH: /members
      MEMBERS_DB_PATH: /data/members.db
      CONTENT_DIR: /data/content
      # Checkout success/cancel return URLs are built from this base —
      # it is the public HTTPS domain (Stripe returns buyers here).
      PUBLIC_BASE_URL: https://members.911transedu.net
      # Payment keys live ONLY in the host .env (never in git). Empty =
      # checkout disabled in the UI; the site runs normally. The
      # members deploy workflow delivers the GitHub Actions secrets
      # STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET into the host .env
      # when they are configured (see services/member-site/
      # STRIPE_GO_LIVE.md).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      BTC_RECEIVE_ADDRESS: ${BTC_RECEIVE_ADDRESS:-}
      CASHAPP_CASHTAG: ${CASHAPP_CASHTAG:-}
    volumes:
      - members-data:/data
    ports:
      - "127.0.0.1:18109:8000"

  specmatrix:
    build:
      context: ./services/specmatrix
    container_name: live-specmatrix
    restart: unless-stopped
    mem_limit: 128m
    environment:
      BASE_PATH: /specmatrix
    ports:
      - "127.0.0.1:18110:8000"

  portal:
    build:
      context: ./services/portal
    container_name: live-portal
    restart: unless-stopped
    mem_limit: 128m
    environment:
      BASE_PATH: /portal
    ports:
      - "127.0.0.1:18111:8000"

  gateway:
    image: nginx:alpine
    container_name: live-gateway
    restart: unless-stopped
    mem_limit: 64m
    network_mode: host
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/locations-common.conf:/etc/nginx/locations-common.conf:ro
      - ./gateway/locations-members-proxy.conf:/etc/nginx/locations-members-proxy.conf:ro
      - ./gateway/locations-members-redirect.conf:/etc/nginx/locations-members-redirect.conf:ro
      # Let's Encrypt cert for members.911transedu.net (host-only state,
      # created by tls/setup.sh; never in git). See tls/README.md.
      - ./tls-state/certs:/etc/nginx/certs:ro
    depends_on:
      - maclan
      - xbox
      - wyze
      - usb
      - aircore
      - fmp
      - celltower
      - cport
      - members
      - specmatrix
      - portal

volumes:
  maclan-data:
  xsave-data:
  celltower-data:
  members-data:
