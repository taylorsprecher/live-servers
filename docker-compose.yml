name: live-servers

# Eight demo servers behind one nginx gateway on host port 443.
# Each service publishes ONLY on 127.0.0.1; the gateway (host networking)
# is the only public entry point, routing by path prefix with the prefix
# forwarded intact. The audited production stack in /opt/audited-stack is
# a separate project and is not touched by this file.

services:
  maclan:
    build:
      context: ./services/maclan
    container_name: live-maclan
    restart: unless-stopped
    mem_limit: 192m
    environment:
      BASE_PATH: /maclan
      MACLAN_DB_PATH: /data/maclan.db
    volumes:
      - maclan-data:/data
    ports:
      - "127.0.0.1:18101:8000"

  xbox:
    build:
      context: ./services/xbox-cloud-saves
    container_name: live-xbox
    restart: unless-stopped
    mem_limit: 192m
    environment:
      BASE_PATH: /xbox
      XSAVE_AUTH: xsts
      XSAVE_STORAGE: local
      XSAVE_PRESIGN: local
      XSAVE_XSTS_SIGNING_KEY: ${XSAVE_XSTS_SIGNING_KEY}
      XSAVE_DEV_SECRET: ${XSAVE_DEV_SECRET}
      # Public base for minted transfer URLs (the gateway strips the
      # port from Host; see backend/app.py). install.sh maintains this
      # in .env; empty = request.base_url fallback (local/tests).
      XSAVE_PUBLIC_BASE_URL: ${XSAVE_PUBLIC_BASE_URL:-}
    volumes:
      - xsave-data:/data/xsave
    ports:
      - "127.0.0.1:18102:8000"

  wyze:
    build:
      context: ./services/wyze-bridge
      dockerfile: Dockerfile.demo
    container_name: live-wyze
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:18103:8000"

  usb:
    build:
      context: ./services/usb-sovereign
    container_name: live-usb
    restart: unless-stopped
    mem_limit: 128m
    environment:
      # AWS sink activation (Stage 3 — runbook:
      # services/usb-sovereign/aws-activation/README.md). The master
      # gate and per-sink flags default OFF here and in the app; the
      # host .env flips them at activation time. Cert paths point into
      # the read-only secrets mount below (populated on the host by
      # bootstrap-certs.sh; the private key never leaves the host).
      USB_SOV_AWS_ENABLED: ${USB_SOV_AWS_ENABLED:-0}
      USB_SOV_AWS_IOT: ${USB_SOV_AWS_IOT:-0}
      USB_SOV_AWS_S3: ${USB_SOV_AWS_S3:-0}
      USB_SOV_IOT_ENDPOINT: ${USB_SOV_IOT_ENDPOINT:-}
      USB_SOV_IOT_CERT: /secrets/usb-sovereign/cert.pem
      USB_SOV_IOT_KEY: /secrets/usb-sovereign/private.key
      USB_SOV_IOT_CA: /secrets/usb-sovereign/AmazonRootCA1.pem
      USB_SOV_S3_BUCKET: ${USB_SOV_S3_BUCKET:-911transedu-serial-batches}
      USB_SOV_AWS_REGION: ${USB_SOV_AWS_REGION:-us-west-2}
    volumes:
      - /home/deploy/live-servers/secrets/usb-sovereign:/secrets/usb-sovereign:ro
    ports:
      - "127.0.0.1:18104:8765"

  aircore:
    build:
      context: ./services/aircore
    container_name: live-aircore
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:18105:8765"

  fmp:
    build:
      context: ./services/fmp
    container_name: live-fmp
    restart: unless-stopped
    mem_limit: 192m
    environment:
      BASE_PATH: /fmp
    ports:
      - "127.0.0.1:18106:8787"

  celltower:
    build:
      context: ./services/cell-tower-lan
    container_name: live-celltower
    restart: unless-stopped
    mem_limit: 256m
    environment:
      BASE_PATH: /celltower
      CELL_LAN_MASTER_KEY: ${CELL_LAN_MASTER_KEY}
    volumes:
      - celltower-data:/data
    ports:
      - "127.0.0.1:18107:4173"

  cport:
    build:
      context: ./services/cport-pipeline
    container_name: live-cport
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:18108:8000"

  members:
    build:
      context: ./services/member-site
    container_name: live-members
    restart: unless-stopped
    mem_limit: 128m
    environment:
      BASE_PATH: /members
      MEMBERS_DB_PATH: /data/members.db
      CONTENT_DIR: /data/content
      # Public base for links and return URLs on this domain.
      PUBLIC_BASE_URL: https://members.911transedu.net
      CASHAPP_CASHTAG: ${CASHAPP_CASHTAG:-}
    volumes:
      - members-data:/data
    ports:
      - "127.0.0.1:18109:8000"

  specmatrix:
    build:
      context: ./services/specmatrix
    container_name: live-specmatrix
    restart: unless-stopped
    mem_limit: 128m
    environment:
      BASE_PATH: /specmatrix
    ports:
      - "127.0.0.1:18110:8000"

  portal:
    build:
      context: ./services/portal
    container_name: live-portal
    restart: unless-stopped
    mem_limit: 128m
    environment:
      BASE_PATH: /portal
    ports:
      - "127.0.0.1:18111:8000"

  syncflow:
    build:
      context: ./services/syncflow
    container_name: live-syncflow
    restart: unless-stopped
    mem_limit: 128m
    environment:
      BASE_PATH: /syncflow
      SYNCFLOW_DATA_DIR: /data
    volumes:
      - syncflow-data:/data
    ports:
      - "127.0.0.1:18112:8000"

  fileslib:
    build:
      context: ./services/files-library
    container_name: live-fileslib
    restart: unless-stopped
    mem_limit: 128m
    environment:
      BASE_PATH: /files
      FILESLIB_DATA_DIR: /data
    volumes:
      - fileslib-data:/data
    ports:
      - "127.0.0.1:18113:8000"

  proxy:
    build:
      context: ./services/proxy
    container_name: live-proxy
    restart: unless-stopped
    mem_limit: 64m
    environment:
      # Taylor's personal Shadowsocks proxy (services/proxy). The
      # password lives ONLY in the host .env (never in git); the
      # proxy deploy workflow delivers the PROXY_SS_PASSWORD GitHub
      # secret there (see ops/set-proxy-password.sh). The container
      # refuses to start when it is unset.
      PROXY_SS_PASSWORD: ${PROXY_SS_PASSWORD:-}
    ports:
      - "127.0.0.1:18114:8388"

  vpn:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: live-vpn
    restart: unless-stopped
    mem_limit: 128m
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      # Taylor's personal WireGuard VPN (services/vpn/README.md).
      # Unlike every other service here it does NOT sit behind the
      # gateway: phones connect to it directly on UDP 51820 — the
      # nginx gateway carries HTTP/WebSocket only and cannot forward
      # WireGuard. The AWS security group must allow inbound UDP
      # 51820. Server and peer keys are generated inside the container
      # on first start and live ONLY in the vpn-data volume, never in
      # git; LOG_CONFS=false keeps peer configs (and their private
      # keys) out of the container log. Peer configs leave the host
      # only through the encrypted export (ops/export-vpn-peer.sh).
      PUID: "1000"
      PGID: "1000"
      TZ: America/Los_Angeles
      SERVERURL: 52.41.84.116
      SERVERPORT: "51820"
      PEERS: taylor,phone2,phone3
      PEERDNS: auto
      INTERNAL_SUBNET: 10.8.0.0
      ALLOWEDIPS: 0.0.0.0/0
      LOG_CONFS: "false"
    volumes:
      - vpn-data:/config
    ports:
      - "51820:51820/udp"

  paydb:
    image: postgres:16-alpine
    container_name: live-paydb
    restart: unless-stopped
    mem_limit: 256m
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_DB: payledger
      POSTGRES_USER: payledger
      POSTGRES_PASSWORD: ${PAYLEDGER_DB_PASSWORD}
    volumes:
      - payledger-data:/var/lib/postgresql/data
    # No published ports: reachable only from the payledger service on
    # the compose network.

  payledger:
    build:
      context: ./services/payment-ledger
    container_name: live-payledger
    restart: unless-stopped
    mem_limit: 192m
    environment:
      BASE_PATH: /ledger
      DATABASE_URL: postgresql://payledger:${PAYLEDGER_DB_PASSWORD}@paydb:5432/payledger
      PAYLEDGER_ADMIN_TOKEN: ${PAYLEDGER_ADMIN_TOKEN:-}
      PAYLEDGER_WEBHOOK_SECRET: ${PAYLEDGER_WEBHOOK_SECRET:-}
      # Authorize.net processor (app_pkg/authnet.py). The credential
      # pair is delivered from GitHub secrets into the host .env by
      # deploy-payledger.yml (ops/set-authnet-creds.sh); both default
      # empty here. AUTHNET_ENABLED is deliberately passed through
      # unset by default: the processor stays DISABLED (fail closed)
      # until the host .env explicitly sets AUTHNET_ENABLED=1.
      AUTHNET_API_LOGIN_ID: ${AUTHNET_API_LOGIN_ID:-}
      AUTHNET_TRANSACTION_KEY: ${AUTHNET_TRANSACTION_KEY:-}
      AUTHNET_ENV: ${AUTHNET_ENV:-production}
      AUTHNET_ENABLED: ${AUTHNET_ENABLED:-}
    depends_on:
      - paydb
    ports:
      - "127.0.0.1:18123:8000"
      
  blackberry:
    build:
      context: ./services/blackberry-lan
    container_name: live-blackberry
    restart: unless-stopped
    mem_limit: 128m
    environment:
      BASE_PATH: /blackberry
    ports:
      - "127.0.0.1:18124:8771"

  flutter:
    build:
      context: ./services/flutter-app
    container_name: live-flutter
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:18125:80"
  zillion:
    build:
      context: ./services/zillion-storage
    container_name: live-zillion
    restart: unless-stopped
    mem_limit: 128m
    environment:
      BASE_PATH: /zillion
      ZILLION_DATA: /data
      # AWS S3 backend (bucket zillion-tb-aws-bucket, management
      # account): base credentials arrive from GitHub secrets via
      # ops/set-zillion-aws-creds.sh into the host .env; the service
      # assumes zillion-control-plane-role via STS. Empty credentials
      # = S3 backend reported not configured, local backends only.
      ZILLION_AWS_ACCESS_KEY_ID: ${ZILLION_AWS_ACCESS_KEY_ID:-}
      ZILLION_AWS_SECRET_ACCESS_KEY: ${ZILLION_AWS_SECRET_ACCESS_KEY:-}
      ZILLION_S3_BUCKET: ${ZILLION_S3_BUCKET:-zillion-tb-aws-bucket}
      ZILLION_S3_REGION: ${ZILLION_S3_REGION:-us-west-2}
      ZILLION_S3_ROLE_ARN: ${ZILLION_S3_ROLE_ARN:-arn:aws:iam::392349106458:role/zillion-control-plane-role}
      ZILLION_S3_KMS_KEY_ID: ${ZILLION_S3_KMS_KEY_ID:-19f314ab-afa4-4746-a2b5-39427104158c}
      # MinIO backend (fleet-internal S3-compatible store, service
      # `minio` below; installed 2026-11-18): the service signs
      # path-style requests with the MinIO root credentials directly
      # — no AssumeRole, no SSE-KMS (both AWS-only). The credentials
      # are generated on the host into .env by ops/deploy-zillion.sh
      # and never live in git; empty credentials = the MinIO backend
      # is reported not configured and the other backends carry on.
      ZILLION_MINIO_ENDPOINT: ${ZILLION_MINIO_ENDPOINT:-http://minio:9000}
      ZILLION_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-}
      ZILLION_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
      ZILLION_MINIO_BUCKET: ${ZILLION_MINIO_BUCKET:-zillion-objects}
    volumes:
      - zillion-data:/data
    ports:
      - "127.0.0.1:18126:8772"

  # MinIO: fleet-internal S3-compatible object store backing the
  # Zillion Storage service's `minio` backend (installed 2026-11-18
  # at Taylor's direction). Loopback-only: the S3 API (:9000) and the
  # console (:9001) are published on host loopback for the deploy
  # smoke checks and local administration; the zillion container
  # reaches the API over the compose network at http://minio:9000.
  # Root credentials come from the host .env, generated there by
  # ops/deploy-zillion.sh — never in git, no usable defaults.
  minio:
    image: ghcr.io/taylorsprecher/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: live-minio
    restart: unless-stopped
    mem_limit: 256m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:18128:9000"
      - "127.0.0.1:18129:9001"

  fastapi-app:
    build:
      context: ./services/fastapi-app
    container_name: live-fastapi-app
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:18127:8000"

  gateway:
    image: nginx:alpine
    container_name: live-gateway
    restart: unless-stopped
    mem_limit: 64m
    network_mode: host
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/locations-common.conf:/etc/nginx/locations-common.conf:ro
      - ./gateway/locations-members-proxy.conf:/etc/nginx/locations-members-proxy.conf:ro
      - ./gateway/locations-members-redirect.conf:/etc/nginx/locations-members-redirect.conf:ro
      # Let's Encrypt cert for members.911transedu.net (host-only state,
      # created by tls/setup.sh; never in git). See tls/README.md.
      - ./tls-state/certs:/etc/nginx/certs:ro
    depends_on:
      - maclan
      - xbox
      - wyze
      - usb
      - aircore
      - fmp
      - celltower
      - cport
      - members
      - specmatrix
      - portal
      - syncflow
      - fileslib
      - proxy
      - payledger
      - flutter
      - zillion
      - fastapi-app

  # Public gateway for the jasmine EC2 instance ONLY (added
  # 2026-11-17, Taylor: "Go public"). Behind the "jasmine" compose
  # profile so a plain `docker compose up` on the audited host never
  # starts it. On jasmine: docker compose --profile jasmine up -d
  # gateway-jasmine. Serves jasmine.911transedu.net on 80/443 with
  # the fleet's path layout for the eight services that run there;
  # backends stay loopback-only. Cert state is host-only under
  # tls-jasmine-state/ (never in git; see tls-jasmine/issue.sh).
  gateway-jasmine:
    profiles: ["jasmine"]
    image: nginx:alpine
    container_name: live-gateway-jasmine
    restart: unless-stopped
    mem_limit: 64m
    network_mode: host
    volumes:
      - ./gateway-jasmine/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway-jasmine/locations-jasmine.conf:/etc/nginx/locations-jasmine.conf:ro
      - ./gateway-jasmine/index.html:/etc/nginx/html-jasmine/index.html:ro
      - ./tls-jasmine-state/certs:/etc/nginx/certs:ro
      - ./tls-jasmine-state/webroot:/var/www/acme:ro
    depends_on:
      - maclan
      - xbox
      - wyze
      - usb
      - aircore
      - fmp
      - celltower
      - blackberry

volumes:
  maclan-data:
  xsave-data:
  celltower-data:
  members-data:
  syncflow-data:
  fileslib-data:
  vpn-data:
  payledger-data:
  zillion-data:
  minio-data:
