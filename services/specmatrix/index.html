 }

  trash2: '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
  sparkles: '<path d="M12 3l1.9 5.7 5.7 1.9-5.7 1.9L12 18.2l-1.9-5.7L4.4 10.6l5.7-1.9z"/><path d="M19 15l.9 2.6 2.6.9-2.6.9L19 22l-.9-2.6-2.6-.9 2.6-.9z"/>',
  checkCircle2: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  alertCircle: '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>'
};
function icon(name, cls) {
  return '<svg class="ic ' + (cls || 'sm') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (P[name] || '') + '</svg>';
}

/* ---------- data & constants ---------- */
const DEVICE_DATASET = JSON.parse(document.getElementById('dataset').textContent);
const CATEGORIES = [
  { id: 'all', name: 'All Devices', icon: 'layers' },
  { id: 'cameras', name: 'Cameras & Cinema', icon: 'camera' },
  { id: 'smartphones', name: 'Smartphones', icon: 'smartphone' },
  { id: 'laptops', name: 'Laptops & Workstations', icon: 'laptop' },
  { id: 'displays', name: 'Displays & Monitors', icon: 'monitor' }
];
const BRANDS = ['All Brands', 'Sony', 'Canon', 'Nikon', 'RED', 'Fujifilm', 'Apple', 'Samsung', 'Google', 'ASUS', 'Dell'];
const MATRIX_ROWS = [
  { label: 'Category', key: 'category', format: (v) => String(v).toUpperCase() },
  { label: 'Release Year', key: 'releaseYear' },
  { label: 'Sensor / Panel Tech', specKey: 'sensor' },
  { label: 'Processor / Chipset', specKey: 'chipset' },
  { label: 'Mount / Form Factor', specKey: 'mount' },
  { label: 'Max Resolution / Speed', specKey: 'maxResolution' },
  { label: 'Dynamic Range / Color', specKey: 'dynamicRange' },
  { label: 'ISO / Sensitivity', specKey: 'isoRange' },
  { label: 'Display / Viewfinder', specKey: 'display' },
  { label: 'Battery / Power', specKey: 'batteryLife' },
  { label: 'Weight & Mass', specKey: 'weight' },
  { label: 'Connectivity & I/O', specKey: 'connectivity' },
  { label: 'Supported Codecs / Tech', specKey: 'codecs' },
  { label: 'Storage Expansion', specKey: 'storage' },
  { label: 'Stabilization / Thermal', specKey: 'stabilization' }
];
const ANALYTICS_METRICS = [
  { label: 'Imaging & Sensor Quality', key: 'imaging', grad: 'linear-gradient(to right,#06b6d4,#3b82f6)' },
  { label: 'Video & Codec Throughput', key: 'video', grad: 'linear-gradient(to right,#8b5cf6,#a855f7)' },
  { label: 'Build & Thermal Resilience', key: 'build', grad: 'linear-gradient(to right,#10b981,#14b8a6)' },
  { label: 'Portability & Battery', key: 'portability', grad: 'linear-gradient(to right,#f59e0b,#eab308)' },
  { label: 'Value for Money Index', key: 'value', grad: 'linear-gradient(to right,#f43f5e,#ec4899)' }
];

/* ---------- state ---------- */
let selectedCategory = 'all';
let selectedBrand = 'All Brands';
let searchQuery = '';
let priceMax = 30000;
let compareIds = ['cam-sony-a1ii', 'cam-canon-r5ii'];
let viewMode = 'matrix'; // 'matrix' | 'grid' | 'analytics' | 'scanner'
let highlightDiffs = false;
let activeModalDevice = null;

/* ---------- helpers ---------- */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function money(n) { return '$' + Number(n).toLocaleString('en-US'); }
function filteredDevices() {
  return DEVICE_DATASET.filter((device) => {
    const matchCat = selectedCategory === 'all' || device.category === selectedCategory;
    const matchBrand = selectedBrand === 'All Brands' || device.brand === selectedBrand;
    const matchPrice = device.price <= priceMax;
    const q = searchQuery.toLowerCase().trim();
    const matchQuery = !q ||
      device.name.toLowerCase().includes(q) ||
      device.brand.toLowerCase().includes(q) ||
      device.specs.sensor.toLowerCase().includes(q) ||
      device.specs.chipset.toLowerCase().includes(q) ||
      device.specs.maxResolution.toLowerCase().includes(q);
    return matchCat && matchBrand && matchPrice && matchQuery;
  });
}
function compareDevices() { return DEVICE_DATASET.filter((d) => compareIds.includes(d.id)); }
function byId(id) { return DEVICE_DATASET.find((d) => d.id === id) || null; }

/* ---------- actions ---------- */
function setView(mode) { viewMode = mode; render(); }
function setCategory(id) { selectedCategory = id; render(); }
function setBrand(b) { selectedBrand = b; render(); }
function clearCompare() { compareIds = []; render(); }
function resetFilters() {
  selectedCategory = 'all'; selectedBrand = 'All Brands';
  searchQuery = ''; priceMax = 30000;
  document.getElementById('searchInput').value = '';
  document.getElementById('priceRange').value = 25000;
  render();
}
function toggleCompare(id) {
  if (compareIds.includes(id)) {
    compareIds = compareIds.filter((item) => item !== id);
  } else {
    if (compareIds.length >= 4) {
      alert('You can compare up to 4 devices side-by-side.');
      return;
    }
    compareIds = [...compareIds, id];
  }
  render();
}
function openModal(id) { activeModalDevice = byId(id); renderModal(); }
function closeModal() { activeModalDevice = null; renderModal(); }
function modalToggle() {
  if (activeModalDevice) { const id = activeModalDevice.id; closeModal(); toggleCompare(id); }
}
function copyComparisonReport() {
  const devs = compareDevices();
  if (devs.length === 0) return;
  let report = 'CROSS-BRAND SPECIFICATION COMPARISON REPORT\nGenerated on: ' + new Date().toLocaleDateString('en-US') + '\n\n';
  devs.forEach((dev) => {
    report += '=== ' + dev.name.toUpperCase() + ' (' + dev.brand + ') ===\n';
    report += 'Price: ' + money(dev.price) + ' | Overall Rating: ' + dev.rating + '/10\n';
    report += 'Sensor/Panel: ' + dev.specs.sensor + '\n';
    report += 'Processor/Chipset: ' + dev.specs.chipset + '\n';
    report += 'Resolution: ' + dev.specs.maxResolution + '\n';
    report += 'Dynamic Range/Color: ' + dev.specs.dynamicRange + '\n';
    report += 'Display: ' + dev.specs.display + '\n';
    report += 'Battery/Power: ' + dev.specs.batteryLife + '\n';
    report += 'Weight: ' + dev.specs.weight + '\n';
    report += 'Connectivity: ' + dev.specs.connectivity + '\n\n';
  });
  const done = () => {
    document.getElementById('toastRoot').innerHTML =
      '<div class="toast">' + icon('checkCircle2', 'lg') + '<span>Comparison Report Copied to Clipboard!</span></div>';
    setTimeout(() => { document.getElementById('toastRoot').innerHTML = ''; }, 3000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(report).then(done, () => fallbackCopy(report, done));
  } else {
    fallbackCopy(report, done);
  }
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) { /* clipboard unavailable */ }
  document.body.removeChild(ta); done();
}

/* ---------- chrome (header / filters) ---------- */
function renderChrome() {
  const tabs = [
    { mode: 'matrix', label: 'Side-by-Side', ic: 'arrowLeftRight' },
    { mode: 'grid', label: 'Catalog', ic: 'layers' },
    { mode: 'analytics', label: 'Score Radar', ic: 'barChart3' },
    { mode: 'scanner', label: 'Deep Scanner', ic: 'search' }
  ];
  document.getElementById('viewTabs').innerHTML = tabs.map((t) =>
    '<button class="tab' + (viewMode === t.mode ? ' on' : '') + '" onclick="setView(\'' + t.mode + '\')">' +
    icon(t.ic) + '<span>' + t.label + '</span></button>'
  ).join('');
  document.getElementById('categoryPills').innerHTML = CATEGORIES.map((cat) =>
    '<button class="pill' + (selectedCategory === cat.id ? ' on' : '') + '" onclick="setCategory(\'' + cat.id + '\')">' +
    icon(cat.icon) + '<span>' + esc(cat.name) + '</span></button>'
  ).join('');
  document.getElementById('brandBtns').innerHTML =
    '<span class="blabel">' + icon('filter', 'sm') + ' Brand:</span>' +
    BRANDS.map((b) =>
      '<button class="bbtn' + (selectedBrand === b ? ' on' : '') + '" onclick="setBrand(\'' + b + '\')">' + esc(b) + '</button>'
    ).join('');
  document.getElementById('pinnedCount').textContent = compareIds.length + '/4';
  document.getElementById('exportBtn').disabled = compareIds.length === 0;
  const dt = document.getElementById('diffToggleWrap');
  dt.hidden = viewMode !== 'matrix';
  document.getElementById('diffToggle').checked = highlightDiffs;
  document.getElementById('priceVal').textContent = priceMax >= 25000 ? '$Any' : money(priceMax);
  document.getElementById('searchClear').hidden = !searchQuery;
}

/* ---------- views ---------- */
function viewMatrix() {
  const devs = compareDevices();
  let h = '<div class="space-y">';
  h += '<div class="viewhead"><div>' +
    '<h2 class="vt">' + icon('arrowLeftRight', 'lg') + ' Cross-Brand Hardware Matrix</h2>' +
    '<p class="vsub">Compare pinned hardware models side-by-side. Click "+ Add to Compare" from the catalog to pin more devices.</p>' +
    '</div>';
  if (devs.length > 0) {
    h += '<button class="btn-clear" onclick="clearCompare()">' + icon('trash2') + ' Clear Matrix</button>';
  }
  h += '</div>';
  if (devs.length === 0) {
    h += '<div class="empty">' +
      '<svg class="ic big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + P.scale + '</svg>' +
      '<h3>No Devices In Comparison Matrix</h3>' +
      '<p>Select devices from the catalog or deep scanner below to pin them for side-by-side spec analysis.</p>' +
      '<button class="btn-primary" onclick="setView(\'grid\')">Browse Catalog</button></div>';
  } else {
    h += '<div class="tblwrap"><table class="matrix"><thead><tr>' +
      '<th class="rowlabel">Specification Field</th>';
    devs.forEach((dev) => {
      h += '<th class="devhead">' +
        '<button class="dev-x" title="Remove from comparison" onclick="toggleCompare(\'' + dev.id + '\')">' + icon('x') + '</button>' +
        '<div class="dev-emoji">' + esc(dev.image) + '</div>' +
        '<span class="brand-badge">' + esc(dev.brand) + '</span>' +
        '<div class="dev-name">' + esc(dev.name) + '</div>' +
        '<div class="dev-pricerow"><span class="dev-price">' + money(dev.price) + '</span>' +
        '<span class="rate-badge">★ ' + dev.rating + ' / 10</span></div>' +
        '<button class="btn-quick" onclick="openModal(\'' + dev.id + '\')">' + icon('eye') + ' Quick View</button>' +
        '</th>';
    });
    h += '</tr></thead><tbody>';
    MATRIX_ROWS.forEach((row) => {
      const values = devs.map((d) => (row.specKey ? d.specs[row.specKey] : d[row.key]));
      const isDifferent = new Set(values.map(String)).size > 1;
      h += '<tr' + (highlightDiffs && isDifferent ? ' class="diffrow"' : '') + '>' +
        '<td class="rowlabel">' + esc(row.label) +
        (highlightDiffs && isDifferent ? '<span class="diff-dot">● DIFF</span>' : '') + '</td>';
      devs.forEach((dev) => {
        const val = row.specKey ? dev.specs[row.specKey] : dev[row.key];
        const displayVal = row.format ? row.format(val) : val;
        h += '<td class="cell">' + esc(displayVal == null || displayVal === '' ? 'N/A' : displayVal) + '</td>';
      });
      h += '</tr>';
    });
    h += '<tr class="scorerow"><td class="rowlabel">Spec Performance Score</td>';
    devs.forEach((dev) => {
      const avg = Math.round((dev.scores.imaging + dev.scores.build + dev.scores.video + dev.scores.portability + dev.scores.value) / 5);
      h += '<td class="cell"><div class="score-flex"><span class="sl">Score:</span><span class="sv">' + avg + ' / 100</span></div>' +
        '<div class="bar"><div style="width:' + avg + '%;background:linear-gradient(to right,#06b6d4,#3b82f6);"></div></div></td>';
    });
    h += '</tr></tbody></table></div>';
  }
  h += '</div>';
  return h;
}

function viewGrid() {
  const devs = filteredDevices();
  let h = '<div class="space-y">';
  h += '<div class="viewhead"><div>' +
    '<h2 class="vt">Hardware Catalog (' + devs.length + ')</h2>' +
    '<p class="vsub">Select devices to inspect detailed specs or add to side-by-side comparison matrix.</p>' +
    '</div></div>';
  if (devs.length === 0) {
    h += '<div class="empty">' +
      '<svg class="ic big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + P.alertCircle + '</svg>' +
      '<p style="color:#94a3b8;font-weight:500;font-size:0.875rem;max-width:none;">No hardware matches your active filters.</p>' +
      '<button class="linkish" onclick="resetFilters()">Reset all filters</button></div>';
  } else {
    h += '<div class="grid">';
    devs.forEach((dev) => {
      const isPinned = compareIds.includes(dev.id);
      h += '<div class="card"><div>' +
        '<div class="card-top"><span class="card-brand">' + esc(dev.brand) + '</span>' +
        '<span class="card-price">' + money(dev.price) + '</span></div>' +
        '<div class="card-title"><div class="card-emoji">' + esc(dev.image) + '</div><div>' +
        '<h3 class="card-name">' + esc(dev.name) + '</h3>' +
        '<p class="card-meta">Released ' + dev.releaseYear + ' • Rated ' + dev.rating + '/10</p>' +
        '</div></div>' +
        '<div class="spec-preview">' +
        '<div class="spr"><span class="k">Sensor/Chip:</span><span class="v">' + esc(dev.specs.sensor || dev.specs.chipset) + '</span></div>' +
        '<div class="spr"><span class="k">Max Res:</span><span class="v cy">' + esc(dev.specs.maxResolution) + '</span></div>' +
        '<div class="spr"><span class="k">Weight:</span><span class="v">' + esc(dev.specs.weight) + '</span></div>' +
        '</div></div>' +
        '<div class="card-actions">' +
        '<button class="btn-full" onclick="openModal(\'' + dev.id + '\')">' + icon('eye') + '<span>Full Specs</span></button>' +
        '<button class="btn-cmp' + (isPinned ? ' on' : '') + '" onclick="toggleCompare(\'' + dev.id + '\')">' +
        icon(isPinned ? 'check' : 'plus') + '<span>' + (isPinned ? 'Pinned' : 'Compare') + '</span></button>' +
        '</div></div>';
    });
    h += '</div>';
  }
  h += '</div>';
  return h;
}

function viewAnalytics() {
  const devs = compareDevices();
  let h = '<div class="space-y">';
  h += '<div><h2 class="vt">' + icon('barChart3', 'lg') + ' Performance &amp; Advantage Radar Breakdown</h2>' +
    '<p class="vsub">Visualizing multidimensional performance across Imaging/Display Quality, Build &amp; Thermals, Video Capabilities, Portability, and Value Score.</p></div>';
  h += '<div class="agrid">';
  if (devs.length === 0) {
    h += '<div class="empty" style="grid-column:1/-1;"><p style="color:#94a3b8;font-size:0.875rem;max-width:none;margin:0;">Please pin 1 or more devices to view visual analytics radar.</p></div>';
  } else {
    devs.forEach((dev) => {
      h += '<div class="acard"><div class="acard-head"><div class="acard-id">' +
        '<span class="acard-emoji">' + esc(dev.image) + '</span><div>' +
        '<h3 class="acard-name">' + esc(dev.name) + '</h3>' +
        '<span class="acard-sub">' + esc(dev.brand) + ' • ' + money(dev.price) + '</span>' +
        '</div></div>' +
        '<span class="acard-rate">Rating ' + dev.rating + '/10</span></div>';
      ANALYTICS_METRICS.forEach((m) => {
        const score = dev.scores[m.key];
        h += '<div class="metric"><div class="mr"><span class="ml">' + esc(m.label) + '</span>' +
          '<span class="mv">' + score + ' / 100</span></div>' +
          '<div class="abar"><div style="width:' + score + '%;background:' + m.grad + ';"></div></div></div>';
      });
      h += '</div>';
    });
  }
  h += '</div></div>';
  return h;
}

function viewScanner() {
  const devs = filteredDevices();
  let h = '<div class="space-y">';
  h += '<div><h2 class="vt">' + icon('search', 'lg') + ' Raw Deep Parameter Spec Scanner</h2>' +
    '<p class="vsub">Low-level spec field query database across all brands and device hardware lines.</p></div>';
  h += '<div class="tblwrap"><table class="scan"><thead><tr>' +
    '<th>Device Name</th><th>Brand</th><th>Category</th><th>Price</th>' +
    '<th>Sensor / Core Architecture</th><th>Max Video / Display Res</th><th>Weight</th>' +
    '<th class="right">Action</th></tr></thead><tbody>';
  devs.forEach((dev) => {
    h += '<tr>' +
      '<td class="sname"><span class="inl"><span>' + esc(dev.image) + '</span><span>' + esc(dev.name) + '</span></span></td>' +
      '<td class="sbrand">' + esc(dev.brand) + '</td>' +
      '<td class="scat">' + esc(dev.category) + '</td>' +
      '<td class="sprice">' + money(dev.price) + '</td>' +
      '<td class="sspec">' + esc(dev.specs.sensor || dev.specs.chipset) + '</td>' +
      '<td class="sres">' + esc(dev.specs.maxResolution) + '</td>' +
      '<td class="sw">' + esc(dev.specs.weight) + '</td>' +
      '<td class="right"><button class="btn-inspect" onclick="openModal(\'' + dev.id + '\')">Inspect</button></td>' +
      '</tr>';
  });
  h += '</tbody></table></div></div>';
  return h;
}

/* ---------- modal ---------- */
function renderModal() {
  const root = document.getElementById('modalRoot');
  if (!activeModalDevice) { root.innerHTML = ''; return; }
  const dev = activeModalDevice;
  const items = Object.entries(dev.specs).map(([key, value]) =>
    '<div class="specitem"><span class="sk">' + esc(key.replace(/([A-Z])/g, ' $1')) + '</span>' +
    '<span class="sv2">' + esc(value) + '</span></div>'
  ).join('');
  root.innerHTML =
    '<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">' +
    '<button class="modal-x" onclick="closeModal()">' + icon('x', 'lg') + '</button>' +
    '<div class="modal-head"><div class="modal-emoji">' + esc(dev.image) + '</div><div>' +
    '<span class="brand-badge">' + esc(dev.brand) + '</span>' +
    '<h2>' + esc(dev.name) + '</h2>' +
    '<p class="modal-meta">Released ' + dev.releaseYear + ' • Price: ' + money(dev.price) + '</p>' +
    '</div></div>' +
    '<h3>Deep Technical Specifications</h3>' +
    '<div class="specgrid">' + items + '</div>' +
    '<div class="modal-actions"><button class="btn-pin" onclick="modalToggle()">' +
    (compareIds.includes(dev.id) ? 'Remove from Matrix' : 'Pin to Matrix') + '</button></div>' +
    '</div></div>';
}

/* ---------- render & init ---------- */
function render() {
  renderChrome();
  const root = document.getElementById('viewRoot');
  if (viewMode === 'matrix') root.innerHTML = viewMatrix();
  else if (viewMode === 'grid') root.innerHTML = viewGrid();
  else if (viewMode === 'analytics') root.innerHTML = viewAnalytics();
  else root.innerHTML = viewScanner();
  renderModal();
}
document.getElementById('logoIcon').innerHTML = icon('cpu');
document.getElementById('exportIcon').innerHTML = icon('share2');
document.getElementById('pinnedIcon').innerHTML = icon('scale');
document.getElementById('searchIcon').innerHTML = icon('search');
