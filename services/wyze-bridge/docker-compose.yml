# Wyze-to-S3 pipeline + bridge status dashboard
# Structured after "WYZE APP.docx" (Docker Wyze Bridge approach).
#
# Default stack:  wyze-bridge + status-api + dashboard
# Archive stack:  add `--profile archive` for s3-sync + kms-validator
#
# ALL credentials come from files in ./secrets/ (Docker Secrets).
# The *.example files there are placeholders — replace them ON THE HOST,
# never commit real values. chmod 600 secrets/* (excluding *.example).
version: "3.9"

services:
  wyze-bridge:
    image: mrlt8/wyze-bridge:latest
    container_name: wyze-bridge
    restart: unless-stopped
    ports:
      - "5000:5000"   # Bridge Web UI
      - "8554:8554"   # RTSP feeds
      - "8888:8888"   # HLS / WebRTC
    secrets:
      - wyze_email
      - wyze_password
    environment:
      WYZE_EMAIL_FILE: /run/secrets/wyze_email
      WYZE_PASSWORD_FILE: /run/secrets/wyze_password
      # docker-wyze-bridge on current Wyze accounts also expects an API
      # key pair; supply via the host environment, not this file:
      #   API_ID / API_KEY  (see .env.example)
      API_ID: ${API_ID:-}
      API_KEY: ${API_KEY:-}
    volumes:
      - ./wyze-config:/config
      - ./recordings:/recordings
    security_opt:
      - no-new-privileges:true

  status-api:
    build: ./backend
    container_name: wyze-bridge-status
    restart: unless-stopped
    environment:
      BRIDGE_HOST: wyze-bridge
      BRIDGE_WEB_PORT: "5000"
      BRIDGE_RTSP_PORT: "8554"
      BRIDGE_HLS_PORT: "8888"
      # Alert history persists in the status-data volume (SQLite).
      ALERTS_DB_PATH: /data/alerts.db
      # Archive-tier deployment flags (booleans only, set in .env by
      # deploy/preflight.sh once a bucket/IAM/KMS actually exist).
      ARCHIVE_ENABLED: ${ARCHIVE_ENABLED:-false}
      ARCHIVE_CONFIGURED: ${ARCHIVE_CONFIGURED:-false}
    volumes:
      - status-data:/data
    ports:
      - "8080:8080"
    depends_on:
      - wyze-bridge
    security_opt:
      - no-new-privileges:true

  dashboard:
    image: nginx:alpine
    container_name: wyze-bridge-dashboard
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    depends_on:
      - status-api
    security_opt:
      - no-new-privileges:true

  # --- Archive tier (spec doc sections 2-3) — opt-in via profile ---------
  s3-sync:
    image: amazon/aws-cli:latest
    container_name: wyze-s3-sync
    restart: unless-stopped
    profiles: ["archive"]
    depends_on:
      - wyze-bridge
    secrets:
      - aws_access_key_id
      - aws_secret_access_key
      - aws_region
      - s3_bucket
    volumes:
      - ./recordings:/recordings:ro
      - ./scripts/sync.sh:/sync.sh:ro
    entrypoint: ["sh", "/sync.sh"]
    security_opt:
      - no-new-privileges:true

  kms-validator:
    image: amazon/aws-cli:latest
    container_name: wyze-kms-validator
    restart: unless-stopped
    profiles: ["archive"]
    depends_on:
      - s3-sync
    secrets:
      - aws_access_key_id
      - aws_secret_access_key
      - aws_region
      - s3_bucket
      - kms_key_arn
      - slack_webhook_url
      - discord_webhook_url
    volumes:
      - ./scripts/kms-validate.sh:/kms-validate.sh:ro
      - ./scripts/run-and-notify.sh:/run-and-notify.sh:ro
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache bash jq curl
        while true; do
          /run-and-notify.sh || true
          sleep 86400
        done
    security_opt:
      - no-new-privileges:true

volumes:
  status-data:  # SQLite alert history for status-api (survives restarts)

secrets:
  wyze_email:
    file: ./secrets/wyze_email
  wyze_password:
    file: ./secrets/wyze_password
  aws_access_key_id:
    file: ./secrets/aws_access_key_id
  aws_secret_access_key:
    file: ./secrets/aws_secret_access_key
  aws_region:
    file: ./secrets/aws_region
  s3_bucket:
    file: ./secrets/s3_bucket
  kms_key_arn:
    file: ./secrets/kms_key_arn
  slack_webhook_url:
    file: ./secrets/slack_webhook_url
  discord_webhook_url:
    file: ./secrets/discord_webhook_url
