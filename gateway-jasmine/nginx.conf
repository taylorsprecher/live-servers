user nginx;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events {
    worker_connections 256;
}

# Public gateway for the jasmine EC2 instance (i-04abda08044c43247,
# AWS management account 392349106458), added 2026-11-17 at Taylor's
# direction ("Go public"). Deliberately simpler than the audited
# host's gateway: jasmine has nothing else on 80/443, so there is no
# stream multiplexer and no per-subdomain vhosts — ONE name,
# jasmine.911transedu.net, with the fleet's path layout served by
# locations-jasmine.conf. Backends stay bound to 127.0.0.1 loopback
# ports exactly as on the audited host (equal protections); this
# gateway is the only public surface.
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;

    # Port 80: Let's Encrypt HTTP-01 challenges from the webroot,
    # everything else redirects to HTTPS.
    server {
        listen 80;
        server_name jasmine.911transedu.net;

        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS for jasmine.911transedu.net. The cert lives in
    # /etc/nginx/certs (host dir tls-jasmine-state/certs — never in
    # git; tls-jasmine/issue.sh installs a self-signed placeholder so
    # nginx can start, then replaces it with the Let's Encrypt cert).
    server {
        listen 443 ssl;
        server_name jasmine.911transedu.net;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 16m;
        absolute_redirect off;

        include /etc/nginx/locations-jasmine.conf;

        # Landing page at the root; the service prefixes above win
        # for their own paths.
        location / {
            root /etc/nginx/html-jasmine;
            index index.html;
        }
    }
}
