# Location blocks for the jasmine instance's public gateway
# (jasmine.911transedu.net). Only the eight services that actually
# run on jasmine are routed here. The proxy blocks are the same
# proven blocks as gateway/locations-common.conf on the audited
# host (same loopback ports, same headers); routes for services
# jasmine does not run (members, portal, files, ledger, syncflow,
# cport, specmatrix) are intentionally absent.

# Bare prefixes -> trailing-slash form.
location = /maclan    { return 301 /maclan/; }
location = /xbox      { return 301 /xbox/ui/; }
location = /xbox/     { return 301 /xbox/ui/; }
location = /wyze      { return 301 /wyze/; }
location = /usb       { return 301 /usb/; }
location = /aircore   { return 301 /aircore/; }
location = /fmp       { return 301 /fmp/; }
location = /celltower { return 301 /celltower/; }
location = /blackberry { return 301 /blackberry/; }

# proxy_pass WITHOUT a URI part: the full original path
# (prefix intact) is forwarded to the service.
location /maclan/ {
    proxy_pass http://127.0.0.1:18101;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

location /xbox/ {
    proxy_pass http://127.0.0.1:18102;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}

location /wyze/ {
    proxy_pass http://127.0.0.1:18103;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}

location /usb/ {
    proxy_pass http://127.0.0.1:18104;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    # WebSocket live push (/usb/ws) + long-lived connections.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

location /blackberry/ {
    proxy_pass http://127.0.0.1:18124;
