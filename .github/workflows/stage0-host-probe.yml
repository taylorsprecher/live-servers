name: Stage 0 host probe (read-only)

# Manually dispatched. Copies ops/stage0-host-probe.sh to the host and runs
# it. The script changes nothing: it reports disk/RAM, Docker containers and
# volumes, host tooling, and the shape of the live tree at
# /home/deploy/live-servers. Full output lands in this run log.

on:
  workflow_dispatch:

jobs:
  stage0-host-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy probe script to host
        run: |
          scp -i ~/.ssh/id_deploy ops/stage0-host-probe.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/deploy/stage0-host-probe.sh"

      - name: Run probe on host
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'bash /home/deploy/stage0-host-probe.sh'
