name: SecureStore vault diagnose

# One-purpose diagnostic: rsync the repo to the host, then run
# ops/vault-diagnose.sh there. The script reports only non-secret
# facts about the vault wiring (presence and length, never values)
# from the host .env and from inside the live payledger container.

on:
  workflow_dispatch:

jobs:
  vault-diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync repo to host
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'secrets/' \
            --exclude 'tls-state/' \
            --exclude '.venv' \
            --exclude 'venv' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude 'demo/' \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/deploy/live-servers/"

      - name: Run vault diagnostic on host
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'bash /home/deploy/live-servers/ops/vault-diagnose.sh'
