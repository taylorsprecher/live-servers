name: Deploy members service only

# Targeted deploy: rsync the repo (same as deploy.yml), then build and
# recreate ONLY the members service on the host. Used when deploy.sh's
# full-build RAM gate is not met in steady state; see
# ops/deploy-members.sh for the reasoning. Gateway/TLS config and all
# other services are untouched.

on:
  workflow_dispatch:

jobs:
  deploy-members:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync repo to host
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'secrets/' \
            --exclude 'tls-state/' \
            --exclude '.venv' \
            --exclude 'venv' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude 'demo/' \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/deploy/live-servers/"

      # Stripe key delivery: when BOTH secrets are configured, pipe
      # them over SSH stdin into the host .env (compose reads it at
      # `up` time) before the members build. Values travel on stdin
      # only — never in argv, never echoed; GitHub also masks secret
      # values in logs. When either secret is absent this step is a
      # no-op and the deploy behaves exactly as before (Cash App stays
      # the operative purchase path). See
      # services/member-site/STRIPE_GO_LIVE.md.
      - name: Deliver Stripe keys to host .env (only when both secrets are set)
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          if [ -z "${STRIPE_SECRET_KEY}" ] || [ -z "${STRIPE_WEBHOOK_SECRET}" ]; then
            echo "Stripe secrets not both configured — skipping key delivery."
            exit 0
          fi
          printf 'STRIPE_SECRET_KEY=%s\nSTRIPE_WEBHOOK_SECRET=%s\n' \
            "${STRIPE_SECRET_KEY}" "${STRIPE_WEBHOOK_SECRET}" \
            | ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              'bash /home/deploy/live-servers/ops/set-stripe-keys.sh'

      - name: Build + up members only on host
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'bash /home/deploy/live-servers/ops/deploy-members.sh'
