name: Deploy btsubs service

# Targeted deploy for the Braintree subscriptions service (fresh
# script replacing Stripe, 2026-11-15): rsync the repo, deliver the
# BT_BRAINTREE_* secrets into the host .env when they are
# configured, then build and recreate ONLY the btsubs service and
# the gateway (and remove the old Stripe subs container) via
# ops/deploy-btsubs.sh. deploy.sh's RAM gate is not in play for a
# one-service change. The members service is untouched.

on:
  workflow_dispatch:

jobs:
  deploy-btsubs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync repo to host
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'secrets/' \
            --exclude 'tls-state/' \
            --exclude '.venv' \
            --exclude 'venv' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude 'demo/' \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/deploy/live-servers/"

      # Credential delivery: when all required BT_BRAINTREE_* secrets
      # exist, pipe them over SSH stdin into
      # ops/set-braintree-keys.sh, which upserts them into the host
      # .env (0600). Values travel on stdin only — never in argv,
      # never echoed; GitHub masks secret values in logs. When any
      # required secret is absent this step SKIPS with a notice: the
      # service installs unconfigured until the owner delivers the
      # Braintree credentials and plan IDs.
      - name: Deliver Braintree credentials (when configured)
        env:
          BT_BRAINTREE_MERCHANT_ID: ${{ secrets.BT_BRAINTREE_MERCHANT_ID }}
          BT_BRAINTREE_PUBLIC_KEY: ${{ secrets.BT_BRAINTREE_PUBLIC_KEY }}
          BT_BRAINTREE_PRIVATE_KEY: ${{ secrets.BT_BRAINTREE_PRIVATE_KEY }}
          BT_BRAINTREE_ENVIRONMENT: ${{ secrets.BT_BRAINTREE_ENVIRONMENT }}
          BT_BRAINTREE_PLAN_CCCE: ${{ secrets.BT_BRAINTREE_PLAN_CCCE }}
          BT_BRAINTREE_PLAN_EMSPR: ${{ secrets.BT_BRAINTREE_PLAN_EMSPR }}
          BT_BRAINTREE_GOOGLE_MERCHANT_ID: ${{ secrets.BT_BRAINTREE_GOOGLE_MERCHANT_ID }}
        run: |
          if [ -z "${BT_BRAINTREE_MERCHANT_ID}" ] || [ -z "${BT_BRAINTREE_PUBLIC_KEY}" ] || [ -z "${BT_BRAINTREE_PRIVATE_KEY}" ] || [ -z "${BT_BRAINTREE_PLAN_CCCE}" ] || [ -z "${BT_BRAINTREE_PLAN_EMSPR}" ]; then
            echo "BT_BRAINTREE_* secrets are not all configured — deploying the service in its unconfigured state."
            exit 0
          fi
          printf 'BT_BRAINTREE_MERCHANT_ID=%s\nBT_BRAINTREE_PUBLIC_KEY=%s\nBT_BRAINTREE_PRIVATE_KEY=%s\nBT_BRAINTREE_ENVIRONMENT=%s\nBT_BRAINTREE_PLAN_CCCE=%s\nBT_BRAINTREE_PLAN_EMSPR=%s\nBT_BRAINTREE_GOOGLE_MERCHANT_ID=%s\n' \
            "${BT_BRAINTREE_MERCHANT_ID}" "${BT_BRAINTREE_PUBLIC_KEY}" "${BT_BRAINTREE_PRIVATE_KEY}" "${BT_BRAINTREE_ENVIRONMENT}" "${BT_BRAINTREE_PLAN_CCCE}" "${BT_BRAINTREE_PLAN_EMSPR}" "${BT_BRAINTREE_GOOGLE_MERCHANT_ID}" \
            | ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                "bash /home/deploy/live-servers/ops/set-braintree-keys.sh"

      - name: Deploy btsubs service on host
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "bash /home/deploy/live-servers/ops/deploy-btsubs.sh"
