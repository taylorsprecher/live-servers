name: Stage 0 capture production baseline

# Manually dispatched (Stage 0 of the fleet redesign, 2026-11-20).
# Copies the host's live tree at /home/deploy/live-servers back to the
# runner, overlays it on a checkout of main, and commits the result to
# branch baseline/production-2026-11-20 so production truth (which
# includes changes never committed, e.g. the Stripe removal) is preserved
# in git. Changes nothing on the host and nothing on main.
#
# Excluded from the capture (never leave the host): .env files, the
# host-only secrets/ directory, tls-state/ (live private keys), .git,
# node_modules, venvs, __pycache__, demo/. A staged-name and content scan
# aborts the run before any push if anything secret-shaped slips in.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Record host-only secrets/ filenames (names only, never values)
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cd /home/deploy/live-servers && echo "host-only secrets/ dir (excluded from capture):" && find secrets -type f -printf "%P\n" 2>/dev/null | sort && echo "host-only tls-state/ dir (excluded from capture)"'

      - name: Rsync host tree to runner staging
        run: |
          mkdir -p "$RUNNER_TEMP/host-tree"
          rsync -az \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'secrets/' \
            --exclude 'tls-state/' \
            --exclude 'node_modules' \
            --exclude '.venv' \
            --exclude 'venv' \
            --exclude '__pycache__' \
            --exclude 'demo/' \
            -e "ssh -i ~/.ssh/id_deploy" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/deploy/live-servers/" \
            "$RUNNER_TEMP/host-tree/"
          echo "Staged files: $(find "$RUNNER_TEMP/host-tree" -type f | wc -l)"

      - name: Overlay host tree on checkout and stage
        run: |
          git checkout -B baseline/production-2026-11-20
          rsync -a --delete \
            --exclude '.git' \
            "$RUNNER_TEMP/host-tree/" ./
          git add -A
          echo "== staged summary =="
          git diff --cached --stat | tail -5
          git status --porcelain | wc -l

      - name: Secret scan of staged changes (abort on any hit)
        run: |
          fail=0
          echo "== staged filename scan =="
          git diff --cached --name-only | grep -E '(^|/)\.env$|(^|/)secrets/|(^|/)tls-state/|privkey|\.key$' \
            | grep -v -E '\.example$' && fail=1 || true
          echo "== staged content scan (file names only) =="
          git diff --cached -U0 | grep -E '^\+' | grep -v -E '^\+\+\+' > "$RUNNER_TEMP/added.txt" || true
          if grep -q -E 'BEGIN [A-Z ]*PRIVATE KEY' "$RUNNER_TEMP/added.txt"; then
            echo "PRIVATE KEY material in staged additions — aborting"; fail=1
          fi
          if grep -q -E 'AKIA[0-9A-Z]{16}' "$RUNNER_TEMP/added.txt"; then
            echo "AWS access key id pattern in staged additions — aborting"; fail=1
          fi
          if grep -q -E '(aws_secret_access_key|DEPLOY_SSH_KEY)\s*[:=]\s*[A-Za-z0-9/+=]{16,}' "$RUNNER_TEMP/added.txt"; then
            echo "Secret assignment pattern in staged additions — aborting"; fail=1
          fi
          rm -f "$RUNNER_TEMP/added.txt"
          if [ "$fail" = "1" ]; then echo "SECRET SCAN FAILED — nothing pushed"; exit 1; fi
          echo "Secret scan clean"

      - name: Commit and push baseline branch
        run: |
          git config user.name "taylorsprecher"
          git config user.email "taylorsprecher@gmail.com"
          if git diff --cached --quiet; then
            echo "No differences between host tree and main — nothing to commit"
            exit 0
          fi
          git commit -m "Production baseline 2026-11-20: host live tree as deployed

          Captured from /home/deploy/live-servers on the audited host during
          Stage 0 of the fleet redesign. This is the tree production actually
          runs, including changes that were rsynced to the host but never
          committed (notably the Stripe removal and member-site changes).
          Excludes .env, secrets/, and tls-state/ (never leave the host)."
          git push origin baseline/production-2026-11-20
          echo "Pushed baseline at $(git rev-parse HEAD)"
