name: Deploy VPN service

# Targeted deploy: rsync the repo (same as deploy.yml), then start
# ONLY the vpn service (WireGuard) on the host. Used instead of the
# full deploy.sh so deploy.sh's RAM gate is not in play for a
# one-service change; see ops/deploy-vpn.sh and
# services/vpn/README.md. The VPN publishes UDP 51820 directly on the
# host (the nginx gateway cannot carry WireGuard), so no gateway
# change is involved. TLS, DNS, all other services and the audited
# production stack are untouched.

# The enable_dns_filter input arms the VPN DNS bug filter
# (services/vpn-dns): when true, a step writes
# VPN_DNS_FILTER_ENABLED=1 into the host .env (value via stdin,
# never in YAML or logs) before the deploy step, so the
# vpn-dns sidecar starts filtering on this same deploy. When
# false/absent the sidecar deploys dark and nothing about the
# phones' DNS changes.

on:
  workflow_dispatch:
    inputs:
      enable_dns_filter:
        description: "Arm the VPN DNS bug filter (writes VPN_DNS_FILTER_ENABLED=1 to the host .env)"
        type: boolean
        default: false
        required: false

jobs:
  deploy-vpn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync repo to host
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'secrets/' \
            --exclude 'tls-state/' \
            --exclude '.venv' \
            --exclude 'venv' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude 'demo/' \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/deploy/live-servers/"

      - name: Arm the VPN DNS filter (only when requested)
        if: ${{ inputs.enable_dns_filter }}
        run: |
          printf 'VPN_DNS_FILTER_ENABLED=1\n' | \
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'bash /home/deploy/live-servers/ops/set-vpn-dns-filter-enabled.sh'

      - name: Start vpn only on host
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'bash /home/deploy/live-servers/ops/deploy-vpn.sh'
