name: TEST draft release download (temporary)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Try downloading draft release asset with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download fileslib-draft-test --repo taylorsprecher/live-servers --pattern 'probe.txt' --dir /tmp/dl
          cat /tmp/dl/probe.txt
