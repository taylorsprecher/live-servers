name: Deploy USB-Sovereign

# Targeted deploy: rsync the repo (same as deploy.yml), then build and
# start ONLY the usb service and verify its status API lists the HDMI
# bridge pair and its publish counter advances; see ops/deploy-usb.sh.
# No other service is rebuilt. Directed 2026-11-19 ("Do the same for
# USB AND HDMI" — the C-Port treatment, incl. the COM_HDMI1/COM_HDMI2
# pair from the 'Cport to Coort' spec update).

on:
  workflow_dispatch:

jobs:
  deploy-usb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync repo to host
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'secrets/' \
            --exclude 'tls-state/' \
            --exclude '.venv' \
            --exclude 'venv' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude 'demo/' \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/deploy/live-servers/"

      - name: Build + up usb on host
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'bash /home/deploy/live-servers/ops/deploy-usb.sh'
