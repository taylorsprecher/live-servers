name: Verify Cash App cashtag on live pages (one-off)

# One-off, manually dispatched, read-only. Curls the public member-site
# pages from the runner (no crawl cache) and reports, per page: HTTP
# status, occurrences of the payment cashtag ($taylorsprecher2026), and
# occurrences of any bare $taylorsprecher left after stripping the 2026
# form. Fails if any page is not 200, any page still shows a bare
# Business cashtag, or a buy/home/preview page lacks the 2026 cashtag.
# Verifies the 2026-11-12 reversal: "Move course payments back to
# $taylorsprecher2026" (the Bitcoin features, including the 50%
# Receive-as-Bitcoin auto-convert, exist only on that account).

on:
  workflow_dispatch:

jobs:
  verify-cashapp-cashtag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe live pages
        run: |
          fail=0
          check() {
            url="$1"; want_cashtag="$2"
            body="$(mktemp)"
            code="$(curl -s -o "${body}" -w '%{http_code}' "${url}")"
            new="$(grep -o 'taylorsprecher2026' "${body}" | wc -l)"
            bare="$(sed 's/taylorsprecher2026//g' "${body}" | grep -o 'taylorsprecher' | wc -l)"
            echo "${url} -> HTTP ${code}, cashtag_2026=${new}, bare_business=${bare}"
            [ "${code}" = "200" ] || fail=1
            [ "${bare}" = "0" ] || fail=1
            if [ "${want_cashtag}" = "yes" ] && [ "${new}" -lt 1 ]; then fail=1; fi
            rm -f "${body}"
          }
          check "https://members.911transedu.net/members/buy/ccce" yes
          check "https://members.911transedu.net/members/buy/emspr" yes
          check "https://members.911transedu.net/members/" yes
          check "https://members.911transedu.net/members/preview" yes
          check "https://members.911transedu.net/portal/" no
          if [ "${fail}" != "0" ]; then
            echo "VERDICT: FAIL"
            exit 1
          fi
          echo "VERDICT: OK — all pages 200, $taylorsprecher2026 present where expected, no bare $taylorsprecher anywhere."
