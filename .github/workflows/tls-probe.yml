name: TLS probe (read-only)

# One-off, manually dispatched. Copies tls/probe.sh to the host and runs it.
# The probe changes nothing: it only reports whether nginx ships the stream
# module, whether the lego ACME image works, and whether a deploy-user
# crontab exists for later cert renewal. Full output lands in this run log.

on:
  workflow_dispatch:

jobs:
  tls-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy probe.sh to host
        run: |
          scp -i ~/.ssh/id_deploy tls/probe.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/deploy/tls-probe.sh"

      - name: Run probe.sh on host
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'bash /home/deploy/tls-probe.sh'
