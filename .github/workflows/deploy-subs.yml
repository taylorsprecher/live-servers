name: Deploy subs service

# Targeted deploy for the Stripe subscriptions service (fresh script,
# 2026-11-15): rsync the repo, deliver the SUBS_STRIPE_* secrets into
# the host .env when they are configured, then build and recreate
# ONLY the subs service and the gateway (which loads the /subs/
# location) via ops/deploy-subs.sh. deploy.sh's RAM gate is not in
# play for a one-service change. The members service is untouched.

on:
  workflow_dispatch:

jobs:
  deploy-subs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync repo to host
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'secrets/' \
            --exclude 'tls-state/' \
            --exclude '.venv' \
            --exclude 'venv' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude 'demo/' \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/deploy/live-servers/"

      # Key delivery: when all three SUBS_STRIPE_* secrets exist,
      # pipe them over SSH stdin into ops/set-subs-stripe-keys.sh,
      # which upserts them into the host .env (0600). Values travel on
      # stdin only — never in argv, never echoed; GitHub masks secret
      # values in logs. When any secret is absent this step SKIPS
      # with a notice (unlike the proxy password, an absent Stripe key
      # must not fail the install: the service runs unconfigured
      # until the owner delivers the keys).
      - name: Deliver subs Stripe keys (when configured)
        env:
          SUBS_STRIPE_SECRET_KEY: ${{ secrets.SUBS_STRIPE_SECRET_KEY }}
          SUBS_STRIPE_WEBHOOK_SECRET: ${{ secrets.SUBS_STRIPE_WEBHOOK_SECRET }}
          SUBS_STRIPE_PUBLISHABLE_KEY: ${{ secrets.SUBS_STRIPE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "${SUBS_STRIPE_SECRET_KEY}" ] || [ -z "${SUBS_STRIPE_WEBHOOK_SECRET}" ] || [ -z "${SUBS_STRIPE_PUBLISHABLE_KEY}" ]; then
            echo "SUBS_STRIPE_* secrets are not all configured — deploying the service in its unconfigured state."
            exit 0
          fi
          printf 'SUBS_STRIPE_SECRET_KEY=%s\nSUBS_STRIPE_WEBHOOK_SECRET=%s\nSUBS_STRIPE_PUBLISHABLE_KEY=%s\n' \
            "${SUBS_STRIPE_SECRET_KEY}" "${SUBS_STRIPE_WEBHOOK_SECRET}" "${SUBS_STRIPE_PUBLISHABLE_KEY}" \
            | ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                "bash /home/deploy/live-servers/ops/set-subs-stripe-keys.sh"

      - name: Deploy subs service on host
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "bash /home/deploy/live-servers/ops/deploy-subs.sh"
