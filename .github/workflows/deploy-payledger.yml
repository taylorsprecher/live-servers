name: Deploy payment ledger

# Targeted deploy: rsync the repo (same as deploy.yml), then build and
# start ONLY the paydb + payledger services and force-recreate the
# gateway so it picks up the /ledger/ location; see
# ops/deploy-payledger.sh. The payledger secrets
# (PAYLEDGER_DB_PASSWORD / PAYLEDGER_ADMIN_TOKEN /
# PAYLEDGER_WEBHOOK_SECRET) are generated on the host into its .env by
# the ops script when absent — this workflow delivers no secrets. No
# other service is rebuilt; the audited production stack is untouched.

on:
  workflow_dispatch:

jobs:
  deploy-payledger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync repo to host
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'secrets/' \
            --exclude 'tls-state/' \
            --exclude '.venv' \
            --exclude 'venv' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude 'demo/' \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/deploy/live-servers/"

      - name: Build + up payledger on host
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'bash /home/deploy/live-servers/ops/deploy-payledger.sh'
