name: Deploy payment ledger

# Targeted deploy: rsync the repo (same as deploy.yml), then build and
# start ONLY the paydb + payledger services and force-recreate the
# gateway so it picks up the /ledger/ location; see
# ops/deploy-payledger.sh. The payledger secrets
# (PAYLEDGER_DB_PASSWORD / PAYLEDGER_ADMIN_TOKEN /
# PAYLEDGER_WEBHOOK_SECRET) are generated on the host into its .env by
# the ops script when absent. The one credential pair this workflow
# DOES deliver is Authorize.net's: when the AUTHNET_API_LOGIN_ID /
# AUTHNET_TRANSACTION_KEY repo secrets are configured, they are piped
# over SSH stdin into the host .env (ops/set-authnet-creds.sh, the
# zillion/proxy pattern — never in argv, never echoed) before the
# build. Delivering them does not enable the processor: AUTHNET_ENABLED
# stays unset (off) unless the host .env deliberately sets it to 1.
# The deliberate on-switch is this workflow's enable_authnet dispatch
# input: set it true and the deploy also upserts AUTHNET_ENABLED=1
# into the host .env (ops/set-authnet-enabled.sh) before the build.
# The same credential-delivery step also carries the optional
# AUTHNET_CLIENT_KEY secret as a third stdin line when configured:
# the Public Client Key is a public Accept.js identifier (not a
# secret), delivered the same way for consistency; the members
# service reads it from the host .env. When that secret is absent,
# any AUTHNET_CLIENT_KEY already in the host .env is preserved.
# eCheck (ACH) has a second, independent on-switch of the same kind:
# the enable_echeck input upserts AUTHNET_ECHECK_ENABLED=1
# (ops/set-authnet-echeck-enabled.sh). Both default false; a plain
# deploy changes neither switch.
# Auto-renewal has a third on-switch of the same kind: the
# enable_renewal input upserts AUTHNET_RENEWAL_ENABLED=1
# (ops/set-authnet-renewal-enabled.sh). It arms BOTH the ledger's
# renewal gate and (after a members redeploy) the buy-page
# auto-renew checkbox, which read the same host .env entry.
# The SecureStore receipt vault follows the identical discipline: its
# Fernet key is delivered from the PAYLEDGER_SECURESTORE_KEY repo
# secret over SSH stdin (ops/set-securestore-key.sh) whenever that
# secret is configured, and the enable_securestore dispatch input
# upserts PAYLEDGER_SECURESTORE_ENABLED=1
# (ops/set-securestore-enabled.sh). Default false; a plain deploy
# changes neither the key nor the switch.
# No other service is rebuilt; the audited production stack is
# untouched.

on:
  workflow_dispatch:
    inputs:
      enable_authnet:
        description: "Also set AUTHNET_ENABLED=1 in the host .env (turns the Authorize.net processor ON at this deploy)"
        type: boolean
        default: false
      enable_echeck:
        description: "Also set AUTHNET_ECHECK_ENABLED=1 in the host .env (turns Authorize.net eCheck/ACH charges ON at this deploy; needs enable_authnet too, valid credentials, and the members redeploy with AUTHNET_CLIENT_KEY before buyers see the ACH option)"
        type: boolean
        default: false
      enable_securestore:
        description: "Also set PAYLEDGER_SECURESTORE_ENABLED=1 in the host .env (turns the SecureStore encrypted checkout-receipt vault ON at this deploy; needs the PAYLEDGER_SECURESTORE_KEY secret delivered and valid, or the vault stays dark)"
        type: boolean
        default: false
      enable_renewal:
        description: "Also set AUTHNET_RENEWAL_ENABLED=1 in the host .env (turns auto-renewal enrollment + the renewal scheduler ON at this deploy; needs enable_authnet + enable_echeck too, valid credentials, and a members redeploy before buyers see the auto-renew checkbox)"
        type: boolean
        default: false

jobs:
  deploy-payledger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync repo to host
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'secrets/' \
            --exclude 'tls-state/' \
            --exclude '.venv' \
            --exclude 'venv' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude 'demo/' \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/deploy/live-servers/"

      # Credential delivery: pipe the AUTHNET_* secrets over SSH
      # stdin into the host .env (compose reads them at `up` time)
      # before the build, so the payledger service's Authorize.net
      # processor can read them from its environment. Values travel
      # on stdin only — never in argv, never echoed; GitHub also
      # masks secret values in logs. When either secret is absent
      # this step is skipped with a notice and the deploy proceeds:
      # the processor must never block the ledger deploy, and it
      # stays disabled until AUTHNET_ENABLED=1 is set in the host
      # .env as a separate deliberate step.
      # The AUTHNET_CLIENT_KEY secret (the public Accept.js client
      # key) rides along as a third line only when configured; the
      # host script upserts it when present and preserves any
      # existing host .env entry when it is not.
      # See ops/set-authnet-creds.sh.
      - name: Deliver Authorize.net credentials to host .env (when configured)
        env:
          AUTHNET_API_LOGIN_ID: ${{ secrets.AUTHNET_API_LOGIN_ID }}
          AUTHNET_TRANSACTION_KEY: ${{ secrets.AUTHNET_TRANSACTION_KEY }}
          AUTHNET_CLIENT_KEY: ${{ secrets.AUTHNET_CLIENT_KEY }}
        run: |
          if [ -z "${AUTHNET_API_LOGIN_ID}" ] || [ -z "${AUTHNET_TRANSACTION_KEY}" ]; then
            echo "AUTHNET_* secrets are not configured — deploying with the Authorize.net processor disabled."
            exit 0
          fi
          { printf 'AUTHNET_API_LOGIN_ID=%s\n' "${AUTHNET_API_LOGIN_ID}"
            printf 'AUTHNET_TRANSACTION_KEY=%s\n' "${AUTHNET_TRANSACTION_KEY}"
            if [ -n "${AUTHNET_CLIENT_KEY}" ]; then
              printf 'AUTHNET_CLIENT_KEY=%s\n' "${AUTHNET_CLIENT_KEY}"
            fi
          } | ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              'bash /home/deploy/live-servers/ops/set-authnet-creds.sh'

      # Deliberate on-switch: runs ONLY when the dispatcher set the
      # enable_authnet input true. Writes AUTHNET_ENABLED=1 into the
      # host .env over the same SSH-stdin pattern, before the build,
      # so this deploy brings the processor up enabled. A plain
      # deploy (input false/absent) never touches the switch.
      # See ops/set-authnet-enabled.sh.
      - name: Enable Authorize.net processor (only when requested)
        if: ${{ inputs.enable_authnet }}
        run: |
          printf 'AUTHNET_ENABLED=1\n' | ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              'bash /home/deploy/live-servers/ops/set-authnet-enabled.sh'

      # eCheck on-switch: same deliberate pattern, one level up.
      # Runs ONLY when the dispatcher set the enable_echeck input
      # true. Writes AUTHNET_ECHECK_ENABLED=1 into the host .env
      # before the build. A plain deploy never touches either
      # switch. See ops/set-authnet-echeck-enabled.sh.
      - name: Enable Authorize.net eCheck (only when requested)
        if: ${{ inputs.enable_echeck }}
        run: |
          printf 'AUTHNET_ECHECK_ENABLED=1\n' | ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              'bash /home/deploy/live-servers/ops/set-authnet-echeck-enabled.sh'

      # Auto-renewal on-switch: same deliberate pattern, one level
      # up from eCheck. Runs ONLY when the dispatcher set the
      # enable_renewal input true. Writes AUTHNET_RENEWAL_ENABLED=1
      # into the host .env before the build. A plain deploy never
      # touches the switch. See ops/set-authnet-renewal-enabled.sh.
      - name: Enable Authorize.net auto-renewal (only when requested)
        if: ${{ inputs.enable_renewal }}
        run: |
          printf 'AUTHNET_RENEWAL_ENABLED=1\n' | ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              'bash /home/deploy/live-servers/ops/set-authnet-renewal-enabled.sh'

      # SecureStore vault key delivery: same SSH-stdin pattern as the
      # Authorize.net credentials. Runs whenever the
      # PAYLEDGER_SECURESTORE_KEY secret is configured; when it is
      # absent the step is skipped with a notice and the deploy
      # proceeds (the vault simply stays dark). Delivering the key
      # does NOT enable the vault — see the enable step below and
      # ops/set-securestore-key.sh.
      - name: Deliver SecureStore vault key to host .env (when configured)
        env:
          PAYLEDGER_SECURESTORE_KEY: ${{ secrets.PAYLEDGER_SECURESTORE_KEY }}
        run: |
          if [ -z "${PAYLEDGER_SECURESTORE_KEY}" ]; then
            echo "PAYLEDGER_SECURESTORE_KEY secret is not configured — deploying with the SecureStore vault dark."
            exit 0
          fi
          echo "vault key length as stored in GitHub: ${#PAYLEDGER_SECURESTORE_KEY} (expect 44; value never shown)"
          printf 'PAYLEDGER_SECURESTORE_KEY=%s\n' "${PAYLEDGER_SECURESTORE_KEY}" | ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              'bash /home/deploy/live-servers/ops/set-securestore-key.sh'

      # SecureStore vault on-switch: same deliberate pattern. Runs
      # ONLY when the dispatcher set the enable_securestore input
      # true. Writes PAYLEDGER_SECURESTORE_ENABLED=1 into the host
      # .env before the build. A plain deploy never touches the
      # switch. See ops/set-securestore-enabled.sh.
      - name: Enable SecureStore vault (only when requested)
        if: ${{ inputs.enable_securestore }}
        run: |
          printf 'PAYLEDGER_SECURESTORE_ENABLED=1\n' | ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              'bash /home/deploy/live-servers/ops/set-securestore-enabled.sh'

      - name: Build + up payledger on host
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'bash /home/deploy/live-servers/ops/deploy-payledger.sh'
