name: Revoke VPN peers

# Targeted revocation: rsync the repo (same as deploy-vpn.yml),
# then run ops/revoke-vpn-peers.sh on the host, which removes
# every WireGuard peer except `taylor` from the vpn service —
# peer config dirs and their [Peer] blocks in wg0.conf — and
# restarts the service. Run at Taylor's 2026-11-18 direction:
# Mom's phone connection (phone2) taken out, no other fleet
# phones allowed. The docker-compose.yml change in the same
# rsync (PEERS: taylor) is what keeps removed peers from being
# regenerated by the image on recreate; the script fails loudly
# if a removed peer reappears. No gateway or other service is
# touched. See services/vpn/README.md ("Revocation (2026-11-18)")
# and ops/revoke-vpn-peers.sh.

on:
  workflow_dispatch:

jobs:
  revoke-vpn-peers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync repo to host
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'secrets/' \
            --exclude 'tls-state/' \
            --exclude '.venv' \
            --exclude 'venv' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude 'demo/' \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/deploy/live-servers/"

      - name: Revoke all VPN peers except taylor on host
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'bash /home/deploy/live-servers/ops/revoke-vpn-peers.sh'
