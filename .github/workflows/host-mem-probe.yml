name: Host memory probe (read-only)

# One-off, manually dispatched. Copies ops/host-mem-probe.sh to the host
# and runs it. The script changes nothing: it reports free memory,
# per-container usage, and the fattest processes. Full output lands in
# this run log.

on:
  workflow_dispatch:

jobs:
  host-mem-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy probe script to host
        run: |
          scp -i ~/.ssh/id_deploy ops/host-mem-probe.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/deploy/host-mem-probe.sh"

      - name: Run probe on host
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'bash /home/deploy/host-mem-probe.sh'
