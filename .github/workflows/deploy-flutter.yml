name: Deploy Flutter app

# Targeted deploy of the Pathways Editor (services/flutter-app) only.
# The Flutter Web bundle is compiled HERE on the runner — the host has
# neither the RAM nor the headroom for a Flutter build next to the live
# fleet — then shipped two ways: it rides the repo rsync into
# services/flutter-app/build/web, and it is also stashed outside the
# repo at /home/deploy/flutter-bundle/, from which
# ops/deploy-flutter.sh installs it before restarting just the flutter
# service plus the gateway. Host sync is rsync, exactly like every
# other fleet workflow (the host checkout is not a git clone).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/flutter-app/**"
      - "ops/deploy-flutter.sh"
      - "docker-compose.yml"
      - "gateway/locations-common.conf"
      - ".github/workflows/deploy-flutter.yml"

jobs:
  deploy-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build the Flutter Web bundle (on the runner, never on the host)
        working-directory: services/flutter-app
        run: |
          flutter pub get
          flutter build web --release --base-href /flutter/
          test -f build/web/index.html
          test -f build/web/main.dart.js
          du -sh build/web

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync repo to host
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'secrets/' \
            --exclude 'tls-state/' \
            --exclude '.venv' \
            --exclude 'venv' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude 'demo/' \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/deploy/live-servers/"

      - name: Stash the bundle outside the repo on the host
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p /home/deploy/flutter-bundle/build/web"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy" \
            services/flutter-app/build/web/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/deploy/flutter-bundle/build/web/"

      - name: Install the bundle + up flutter on host
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'bash /home/deploy/live-servers/ops/deploy-flutter.sh'
