name: Cell Tower diagnose (read-only)

# One-off, manually dispatched. Copies services/cell-tower-lan/diagnose.sh
# to the host and runs it. The script changes nothing: it reports container
# state, recent logs, and loopback health for live-celltower. Full output
# lands in this run log.

on:
  workflow_dispatch:

jobs:
  celltower-diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy diagnose.sh to host
        run: |
          scp -i ~/.ssh/id_deploy services/cell-tower-lan/diagnose.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/deploy/celltower-diagnose.sh"

      - name: Run diagnose.sh on host
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'bash /home/deploy/celltower-diagnose.sh'
