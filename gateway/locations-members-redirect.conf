# /members/ handling — REDIRECT mode (plain-HTTP server only).
# Taylor's direction (2026-11-11): the member links already emailed to
# fire departments (http://52.41.84.116:443/members/...) auto-forward to
# the same path on the secure hostname. Members-only on purpose: every
# other service keeps its existing http://52.41.84.116:443 address.
# $request_uri preserves the full path and query string.

location = /members { return 301 https://members.911transedu.net/members/; }

location /members/ {
    return 301 https://members.911transedu.net$request_uri;
}
