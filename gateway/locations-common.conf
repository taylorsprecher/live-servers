# Gateway location blocks shared by BOTH gateway servers (plain HTTP on
# 127.0.0.1:10443 and HTTPS on 127.0.0.1:18443): every proxied service
# except /members/ (which lives in the locations-members-*.conf files,
# because its HTTP handling differs: proxy first, redirect after the
# Let's Encrypt cert is live). The bare-prefix redirects and the proxy
# blocks below are exactly the ones that served on :443 before TLS was
# added; they were moved here verbatim so the two servers cannot drift.

# Bare prefixes -> trailing-slash form.
location = /maclan    { return 301 /maclan/; }
location = /xbox      { return 301 /xbox/ui/; }
location = /xbox/     { return 301 /xbox/ui/; }
location = /wyze      { return 301 /wyze/; }
location = /usb       { return 301 /usb/; }
location = /aircore   { return 301 /aircore/; }
location = /fmp       { return 301 /fmp/; }
location = /celltower { return 301 /celltower/; }
location = /cport     { return 301 /cport/; }
location = /specmatrix { return 301 /specmatrix/; }

# proxy_pass WITHOUT a URI part: the full original path
# (prefix intact) is forwarded to the service.
location /maclan/ {
    proxy_pass http://127.0.0.1:18101;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

location /xbox/ {
    proxy_pass http://127.0.0.1:18102;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}

location /wyze/ {
    proxy_pass http://127.0.0.1:18103;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}

location /usb/ {
    proxy_pass http://127.0.0.1:18104;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    # WebSocket live push (/usb/ws) + long-lived connections.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

location /aircore/ {
    proxy_pass http://127.0.0.1:18105;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}

location /fmp/ {
    proxy_pass http://127.0.0.1:18106;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    # WebSocket (/fmp/api/events/ws) and SSE (/fmp/api/events/stream).
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

location /celltower/ {
    proxy_pass http://127.0.0.1:18107;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}

# C-Port pipeline is a metrics-only target: its Prometheus server
# serves at the ROOT (/metrics) and knows no base path, so here —
# unlike the services above — proxy_pass carries a URI part and
# nginx strips the /cport prefix: /cport/metrics -> /metrics.
location /cport/ {
    proxy_pass http://127.0.0.1:18108/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}

# Spec Matrix: static single-page analyzer; prefix forwarded
# intact (the app routes under /specmatrix itself).
location /specmatrix/ {
    proxy_pass http://127.0.0.1:18110;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}
