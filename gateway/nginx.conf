        location = / { return 301 /fmp/; }
    }

    server {
        listen 127.0.0.1:18443 ssl;
        server_name celltower.911transedu.net;

        ssl_certificate     /etc/nginx/certs/celltower/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/celltower/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 16m;

        # Redirects generated in this vhost (root + bare-prefix)
        # must be relative: this server listens on loopback :18443
        # behind the stream mux, and the default absolute form would
        # leak that internal port into the Location header.
        absolute_redirect off;

        include /etc/nginx/locations-common.conf;
        location = / { return 301 /celltower/; }
    }

    server {
        listen 127.0.0.1:18443 ssl;
        server_name specmatrix.911transedu.net;

        ssl_certificate     /etc/nginx/certs/specmatrix/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/specmatrix/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 16m;

        # Redirects generated in this vhost (root + bare-prefix)
        # must be relative: this server listens on loopback :18443
        # behind the stream mux, and the default absolute form would
        # leak that internal port into the Location header.
        absolute_redirect off;

        include /etc/nginx/locations-common.conf;
        location = / { return 301 /specmatrix/; }

        # Personal Shadowsocks-over-WebSocket endpoint (services/
        # proxy, added 2026-11-13). The proxy has no subdomain of
        # its own — proxy.911transedu.net does not exist in DNS
        # (the zone is edited by hand at GoDaddy and the deploy
        # pipeline has no DNS access), so the WebSocket path rides
        # this demo vhost's existing name and cert. Exact path only,
        # in this one vhost only; the backend answers a WebSocket
        # upgrade (101) or nothing (400). See services/proxy/
        # README.md.
        location = /proxy {
            proxy_pass http://127.0.0.1:18114;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
