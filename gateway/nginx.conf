user nginx;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events {
    worker_connections 256;
}

# --- Port-443 multiplexing (added 2026-11-11 for members HTTPS) --------
# The stream layer owns public :443 and sorts connections by what the
# client actually sends, without decrypting or altering any bytes:
#   * TLS-ALPN-01 validation probes (ALPN "acme-tls/1") -> 127.0.0.1:18444
#     (the lego ACME client, only listening during issuance/renewal)
#   * TLS with SNI <service>.911transedu.net -> 127.0.0.1:18443 (HTTPS
#     below; one server block per subdomain, each with its own cert).
#     members.911transedu.net came first (2026-11-11); the eight service
#     subdomains were added 2026-11-12 (Taylor: "All on our own domain
#     and subdomain"), same pattern, IP paths untouched.
#   * everything else — including ALL plain HTTP to 52.41.84.116:443,
#     whose clients send no ClientHello at all — -> 127.0.0.1:10443, the
#     original HTTP service, byte-for-byte as before.
stream {
    upstream gw_http { server 127.0.0.1:10443; }
    upstream gw_tls  { server 127.0.0.1:18443; }
    upstream gw_acme { server 127.0.0.1:18444; }

    map "$ssl_preread_alpn_protocols $ssl_preread_server_name" $gw_upstream {
        "~acme-tls/1"                  gw_acme;
        "~members\.911transedu\.net$" gw_tls;
        "~maclan\.911transedu\.net$"    gw_tls;
        "~xbox\.911transedu\.net$"      gw_tls;
        "~wyze\.911transedu\.net$"      gw_tls;
        "~usb\.911transedu\.net$"       gw_tls;
        "~aircore\.911transedu\.net$"   gw_tls;
        "~fmp\.911transedu\.net$"       gw_tls;
        "~celltower\.911transedu\.net$" gw_tls;
        "~specmatrix\.911transedu\.net$" gw_tls;
        default                        gw_http;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $gw_upstream;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;

    # The original plain-HTTP service. It listened on 443 directly until
    # 2026-11-11; the stream block above now owns 443 and forwards
    # non-TLS traffic here untouched. Routing is shared with the HTTPS
    # server via locations-common.conf. /members/ handling is included
    # separately: since the Let's Encrypt cert went live it REDIRECTS
    # to the HTTPS hostname (Taylor's direction, members-only — every
    # other service keeps its http://52.41.84.116:443 address).
    server {
        listen 127.0.0.1:10443;
        server_name _;

        client_max_body_size 16m;

        include /etc/nginx/locations-common.conf;
        include /etc/nginx/locations-members-redirect.conf;
    }

    # HTTPS for members.911transedu.net (Let's Encrypt cert in
    # /etc/nginx/certs, a host dir under tls-state/ — never in git).
    # Same routing as HTTP; /members/ always proxies here (the redirect
    # lives only on the HTTP server).
    server {
        listen 127.0.0.1:18443 ssl;
        server_name members.911transedu.net;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 16m;

        include /etc/nginx/locations-common.conf;
        include /etc/nginx/locations-members-proxy.conf;
    }

    # HTTPS for the eight service subdomains (added 2026-11-12, same
    # pattern as members): one server block per name, each with its own
    # Let's Encrypt cert under /etc/nginx/certs/<name>/ (host dir under
    # tls-state/ — never in git; see tls/README.md). Routing is the same
    # locations-common.conf as HTTP and members, so the full path layout
    # is mirrored: https://xbox.911transedu.net/xbox/ui/ serves exactly
    # what http://52.41.84.116:443/xbox/ui/ serves. The subdomain root
    # forwards to the service's own entry path. NO /members/ locations
    # here: members lives only on its own subdomain (its block above),
    # and NO redirect lives on the HTTP server for these names — the
    # IP paths keep serving plain HTTP exactly as before.
    server {
        listen 127.0.0.1:18443 ssl;
        server_name maclan.911transedu.net;

        ssl_certificate     /etc/nginx/certs/maclan/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/maclan/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 16m;

        # Redirects generated in this vhost (root + bare-prefix)
        # must be relative: this server listens on loopback :18443
        # behind the stream mux, and the default absolute form would
        # leak that internal port into the Location header.
        absolute_redirect off;

        include /etc/nginx/locations-common.conf;
        location = / { return 301 /maclan/; }
    }

    server {
        listen 127.0.0.1:18443 ssl;
        server_name xbox.911transedu.net;

        ssl_certificate     /etc/nginx/certs/xbox/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/xbox/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 16m;

        # Redirects generated in this vhost (root + bare-prefix)
        # must be relative: this server listens on loopback :18443
        # behind the stream mux, and the default absolute form would
        # leak that internal port into the Location header.
        absolute_redirect off;

        include /etc/nginx/locations-common.conf;
        location = / { return 301 /xbox/ui/; }
    }

    server {
        listen 127.0.0.1:18443 ssl;
        server_name wyze.911transedu.net;

        ssl_certificate     /etc/nginx/certs/wyze/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/wyze/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 16m;

        # Redirects generated in this vhost (root + bare-prefix)
        # must be relative: this server listens on loopback :18443
        # behind the stream mux, and the default absolute form would
        # leak that internal port into the Location header.
        absolute_redirect off;

        include /etc/nginx/locations-common.conf;
        location = / { return 301 /wyze/; }
    }

    server {
        listen 127.0.0.1:18443 ssl;
        server_name usb.911transedu.net;

        ssl_certificate     /etc/nginx/certs/usb/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/usb/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 16m;

        # Redirects generated in this vhost (root + bare-prefix)
        # must be relative: this server listens on loopback :18443
        # behind the stream mux, and the default absolute form would
        # leak that internal port into the Location header.
        absolute_redirect off;

        include /etc/nginx/locations-common.conf;
        location = / { return 301 /usb/; }
    }

    server {
        listen 127.0.0.1:18443 ssl;
        server_name aircore.911transedu.net;

        ssl_certificate     /etc/nginx/certs/aircore/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/aircore/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 16m;

        # Redirects generated in this vhost (root + bare-prefix)
        # must be relative: this server listens on loopback :18443
        # behind the stream mux, and the default absolute form would
        # leak that internal port into the Location header.
        absolute_redirect off;

        include /etc/nginx/locations-common.conf;
        location = / { return 301 /aircore/; }
    }

    server {
        listen 127.0.0.1:18443 ssl;
        server_name fmp.911transedu.net;

        ssl_certificate     /etc/nginx/certs/fmp/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/fmp/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 16m;

        # Redirects generated in this vhost (root + bare-prefix)
        # must be relative: this server listens on loopback :18443
        # behind the stream mux, and the default absolute form would
        # leak that internal port into the Location header.
        absolute_redirect off;

