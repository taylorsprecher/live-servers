user nginx;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events {
    worker_connections 256;
}

# --- Port-443 multiplexing (added 2026-11-11 for members HTTPS) --------
# The stream layer owns public :443 and sorts connections by what the
# client actually sends, without decrypting or altering any bytes:
#   * TLS-ALPN-01 validation probes (ALPN "acme-tls/1") -> 127.0.0.1:18444
#     (the lego ACME client, only listening during issuance/renewal)
#   * TLS with SNI members.911transedu.net -> 127.0.0.1:18443 (HTTPS below)
#   * everything else — including ALL plain HTTP to 52.41.84.116:443,
#     whose clients send no ClientHello at all — -> 127.0.0.1:10443, the
#     original HTTP service, byte-for-byte as before.
stream {
    upstream gw_http { server 127.0.0.1:10443; }
    upstream gw_tls  { server 127.0.0.1:18443; }
    upstream gw_acme { server 127.0.0.1:18444; }

    map "$ssl_preread_alpn_protocols $ssl_preread_server_name" $gw_upstream {
        "~acme-tls/1"                  gw_acme;
        "~members\.911transedu\.net$" gw_tls;
        default                        gw_http;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $gw_upstream;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;

    # The original plain-HTTP service. It listened on 443 directly until
    # 2026-11-11; the stream block above now owns 443 and forwards
    # non-TLS traffic here untouched. Routing is shared with the HTTPS
    # server via locations-common.conf. /members/ handling is included
    # separately: proxy mode first, redirect mode (to the HTTPS
    # hostname) once the Let's Encrypt cert was live.
    server {
        listen 127.0.0.1:10443;
        server_name _;

        client_max_body_size 16m;

        include /etc/nginx/locations-common.conf;
        include /etc/nginx/locations-members-proxy.conf;
    }

    # HTTPS for members.911transedu.net (Let's Encrypt cert in
    # /etc/nginx/certs, a host dir under tls-state/ — never in git).
    # Same routing as HTTP; /members/ always proxies here (the redirect
    # lives only on the HTTP server).
    server {
        listen 127.0.0.1:18443 ssl;
        server_name members.911transedu.net;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 16m;

        include /etc/nginx/locations-common.conf;
        include /etc/nginx/locations-members-proxy.conf;
    }
}
