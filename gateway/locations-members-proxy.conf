# /members/ handling — PROXY mode.
# Used by the HTTPS server (members.911transedu.net) permanently, and by
# the plain-HTTP server until the Let's Encrypt cert was live (at which
# point the HTTP server switched to locations-members-redirect.conf).
# Member-login training site: prefix forwarded intact like the other
# full services (the app routes under /members itself).

location = /members { return 301 /members/; }

location /members/ {
    proxy_pass http://127.0.0.1:18109;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}

# /subs/ — Stripe subscriptions service (fresh script, 2026-11-15).
# Same vhost, same prefix-intact forwarding: the app routes under
# /subs itself (BASE_PATH=/subs), including its Stripe webhook at
# /subs/webhook.

location = /subs { return 301 /subs/; }

location /subs/ {
    proxy_pass http://127.0.0.1:18121;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}
