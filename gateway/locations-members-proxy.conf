# /members/ handling — PROXY mode.
# Used by the HTTPS server (members.911transedu.net) permanently, and by
# the plain-HTTP server until the Let's Encrypt cert was live (at which
# point the HTTP server switched to locations-members-redirect.conf).
# Member-login training site: prefix forwarded intact like the other
# full services (the app routes under /members itself).

location = /members { return 301 /members/; }

location /members/ {
    proxy_pass http://127.0.0.1:18109;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}

# Payment ledger platform (services/payment-ledger): prefix forwarded
# intact; the app routes under /ledger itself. Status page and read
# endpoints are public; writes require the admin token configured in
# the host .env (PAYLEDGER_ADMIN_TOKEN) and webhooks verify HMAC when
# PAYLEDGER_WEBHOOK_SECRET is set.
location = /ledger { return 301 /ledger/; }

location /ledger/ {
    proxy_pass http://127.0.0.1:18123;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}
